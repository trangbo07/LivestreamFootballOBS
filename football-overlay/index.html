<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Overlay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Great+Vibes&family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/ticker.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/lineup.css">
    <link rel="stylesheet" href="css/analysis.css">
    <link rel="stylesheet" href="css/tribute.css">
    <link rel="stylesheet" href="css/photo.css">
</head>
<body>
<div id="stage">

    <!-- Khung viền -->
    <div class="frame" id="frame"></div>

    <!-- CHẾ ĐỘ PHÂN TÍCH: khung camera thu nhỏ + heatmap + thống kê -->
    <div class="an" id="analysis"></div>

    <!-- KHUNG 2 CAMERA (PiP / chia đôi) -->
    <div class="camfx" id="camfx"></div>

    <!-- LOGO / WATERMARK -->
    <div class="wm glass off" id="watermark">
        <div class="wm-top">
            <img class="wm-logo" id="wm-logo" alt="">
            <div class="wm-title" id="wm-title"></div>
        </div>
        <div class="wm-bottom">
            <div class="wm-line1" id="wm-line1"></div>
            <div class="wm-line2" id="wm-line2"></div>
        </div>
    </div>

    <!-- SOCIAL / FOLLOW US -->
    <div class="social" id="social"></div>

    <!-- DONATION -->
    <div class="dn" id="donation">
        <div class="dn-qr"><img id="dn-qr" alt="QR"><span class="dn-qr-fallback">QR</span></div>
        <div class="dn-right">
            <div class="dn-title"><span id="dn-title"></span></div>
            <div class="dn-info" id="dn-info"></div>
        </div>
    </div>

    <!-- LOWER THIRD -->
    <div class="lt" id="lowerthird">
        <div class="lt-accent"></div>
        <div class="lt-clip lt-clip-main">
            <div class="lt-main">
                <svg class="lt-icon" viewBox="0 0 40 40" aria-hidden="true">
                    <circle cx="20" cy="20" r="18" fill="#fff"/>
                    <path d="M20 12.5l6.6 4.8-2.5 7.8h-8.2l-2.5-7.8z" fill="#0b1a4a"/>
                    <path d="M20 2v10.5M26.6 17.3l9.3-3.6M24.1 25.1l5.8 8.6M15.9 25.1l-5.8 8.6M13.4 17.3L4.1 13.7" stroke="#0b1a4a" stroke-width="2"/>
                </svg>
                <div class="lt-name" id="lt-name"></div>
            </div>
        </div>
        <div class="lt-clip lt-clip-sub">
            <div class="lt-sub" id="lt-sub"></div>
        </div>
    </div>

    <!-- DATE -->
    <div class="datebox glass off" id="datebox">
        <div class="db-month" id="db-month"></div>
        <div class="db-day"><span id="db-day"></span></div>
        <div class="db-year" id="db-year"></div>
    </div>

    <!-- SCOREBOARD -->
    <div class="sb off" id="scoreboard">
        <div class="sb-glow"></div>
        <div class="sb-period" id="sb-period"></div>
        <div class="sb-body">
            <div class="sb-team sb-home" id="sb-home">
                <div class="sb-logo-wrap"><img class="sb-logo" id="sb-home-logo" alt=""></div>
                <div class="sb-name" id="sb-home-name"></div>
                <div class="sb-kit" id="sb-home-kit"></div>
            </div>
            <div class="sb-center">
                <div class="sb-score" id="sb-home-score"><span>0</span></div>
                <div class="sb-clock"><div class="sb-time" id="sb-time"></div></div>
                <div class="sb-score" id="sb-away-score"><span>0</span></div>
            </div>
            <div class="sb-team sb-away" id="sb-away">
                <div class="sb-name" id="sb-away-name"></div>
                <div class="sb-logo-wrap"><img class="sb-logo" id="sb-away-logo" alt=""></div>
                <div class="sb-kit" id="sb-away-kit"></div>
            </div>
        </div>
        <div class="sb-added" id="sb-added"></div>
    </div>

    <!-- TICKER + LIVE -->
    <div class="tk off" id="ticker">
        <div class="tk-viewport" id="tk-viewport">
            <div class="tk-track" id="tk-track"></div>
        </div>
        <div class="tk-fade tk-fade-l"></div>
        <div class="tk-fade tk-fade-r"></div>
        <div class="tk-cap">
            <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#0b1a4a"/><path d="M20 12.5l6.6 4.8-2.5 7.8h-8.2l-2.5-7.8z" fill="#fff"/><path d="M20 3v9.5M26.6 17.3l8.6-3.3M24.1 25.1l5.3 7.9M15.9 25.1l-5.3 7.9M13.4 17.3L4.8 14" stroke="#fff" stroke-width="2"/></svg>
        </div>
    </div>
    <div class="live off" id="live">
        <span class="live-dot"></span><span class="live-text">LIVE</span>
    </div>

    <!-- CHAT -->
    <div class="chat off" id="chat">
        <div class="chat-tab"><span class="chat-tab-dot"></span>LIVE CHAT<span class="chat-src"><svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#ff0000"/><path d="M11 5.5v9l7.5-4.5z" fill="#fff"/></svg>YOUTUBE</span></div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- ĐỘI HÌNH RA SÂN -->
    <div class="lu" id="lineup"></div>

    <!-- ĐẾM NGƯỢC TRƯỚC TRẬN -->
    <div class="cd pp-panel" id="countdown"></div>

    <!-- KHUNG ẢNH TRẬN ĐẤU -->
    <div class="ph" id="photo"></div>

    <!-- TRI ÂN HUYỀN THOẠI: badge góc + các màn banner -->
    <div class="tb-badge" id="tribute-badge"></div>
    <div class="tb" id="tribute"></div>

    <!-- POPUPS (GOAL / CARD / SUB / STATUS / STATS) -->
    <div class="popup-layer" id="popup-layer"></div>
</div>

<!-- Thanh công cụ preview: chỉ hiện khi mở bằng trình duyệt thường, KHÔNG hiện trong OBS -->
<div class="devbar" id="devbar" hidden>
    <button id="dev-demo">DEMO MODE: ON</button>
    <button id="dev-bg">NỀN PREVIEW</button>
    <a href="control.html" target="_blank">CONTROL PANEL ↗</a>
    <span class="devbar-keys">Space G Y R S H F T C L D</span>
</div>

<script src="js/config.js"></script>
<script src="js/bus.js"></script>
<script src="js/i18n.js"></script>
<script src="js/scoreboard.js"></script>
<script src="js/ticker.js"></script>
<script src="js/chat.js"></script>
<script src="js/popup.js"></script>
<script src="js/lineup.js"></script>
<script src="js/analysis.js"></script>
<script src="js/camfx.js"></script>
<script src="js/tribute.js"></script>
<script src="js/photo.js"></script>
<script src="js/overlay.js"></script>
</body>
</html>
