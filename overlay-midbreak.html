<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Midbreak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bar: #0a2464;
      --bar-mid: #0c2a78;
      --ink: #f5f8ff;
      --accent: #f5c518;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Barlow Condensed", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 198px 40px 40px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .midbreak-card {
      width: min(980px, 94vw);
      background: linear-gradient(180deg, rgba(12, 42, 120, 0.95) 0%, rgba(10, 36, 100, 0.95) 100%);
      border: 2px solid rgba(245, 197, 24, 0.8);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
      padding: 12px 16px 20px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
    }

    .midbreak-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .midbreak-top {
      height: 34px;
      background: linear-gradient(180deg, var(--bar-mid) 0%, var(--bar) 100%);
      border: 2px solid rgba(245, 197, 24, 0.8);
      margin: 0 40px 14px;
      color: #f4f7fb;
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      display: grid;
      place-items: center;
      text-transform: uppercase;
    }

    .scoreline {
      margin: 14px 20px 0;
      padding: 12px 16px;
      background: rgba(9, 24, 60, 0.9);
      color: #fff;
      border-radius: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(245, 197, 24, 0.55);
    }

    .team-name {
      font-size: clamp(1.05rem, 2.1vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-name.left {
      text-align: left;
    }

    .team-name.right {
      text-align: right;
    }

    .score-main {
      font-size: clamp(1.5rem, 3.8vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
    }

    .scorer-board {
      margin: 12px 20px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .scorer-col {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 140px;
      border: 1px solid rgba(245, 197, 24, 0.45);
    }

    .scorer-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #1f3454;
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    .scorer-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
    }

    .scorer-item {
      font-size: clamp(0.9rem, 1.45vw, 1.16rem);
      font-weight: 800;
      color: #101010;
      display: flex;
      gap: 6px;
      align-items: flex-start;
      line-height: 1.2;
    }

    .scorer-item::before {
      content: "⚽";
      line-height: 1;
      margin-top: 1px;
    }

    .scorer-empty {
      font-size: 0.88rem;
      font-weight: 700;
      color: #5e6777;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    @media (max-width: 640px) {
      .wrap { padding: 192px 10px 10px; }
      .midbreak-top { margin: 0 8px 10px; }
      .scoreline {
        margin: 10px 0 0;
        padding: 10px;
        gap: 8px;
      }

      .scorer-board {
        margin: 10px 0 0;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="midbreak-card" id="midbreakCard">
      <div class="midbreak-top" id="midbreakTitle">NGHI GIUA HIEP</div>

      <div class="scoreline">
        <div class="team-name left" id="teamA">TEAM A</div>
        <div class="score-main"><span id="scoreA">0</span> - <span id="scoreB">0</span></div>
        <div class="team-name right" id="teamB">TEAM B</div>
      </div>

      <div class="scorer-board">
        <section class="scorer-col">
          <h3 class="scorer-title">Nguoi ghi ban doi A</h3>
          <ul class="scorer-list" id="scorersA"></ul>
        </section>
        <section class="scorer-col">
          <h3 class="scorer-title">Nguoi ghi ban doi B</h3>
          <ul class="scorer-list" id="scorersB"></ul>
        </section>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "scoreData.v2";
    const API_PATH = "/api/score";
    const STREAM_PATH = "/api/score/stream";
    const CAN_USE_HTTP = location.protocol === "http:" || location.protocol === "https:";

    const el = {
      midbreakCard: document.getElementById("midbreakCard"),
      midbreakTitle: document.getElementById("midbreakTitle"),
      teamA: document.getElementById("teamA"),
      scoreA: document.getElementById("scoreA"),
      scoreB: document.getElementById("scoreB"),
      teamB: document.getElementById("teamB"),
      scorersA: document.getElementById("scorersA"),
      scorersB: document.getElementById("scorersB")
    };

    let streamConnected = false;
    let stream = null;
    let reconnectTimer = null;

    function normalizeInfoPanelMode(value) {
      const s = (value ?? "").toString().trim().toLowerCase();
      if (s === "midbreak" || s === "break" || s === "ht" || s === "half") return "midbreak";
      return "off";
    }

    function safeText(value, fallback) {
      const text = (value ?? "").toString().trim();
      return text || fallback;
    }

    function toNumber(value, min, max) {
      const n = Number.parseInt(value, 10);
      if (Number.isNaN(n) || n < min) return min;
      if (n > max) return max;
      return n;
    }

    function parseScorers(raw) {
      return (raw ?? "")
        .toString()
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean)
        .slice(0, 14);
    }

    function renderScorerList(node, items) {
      if (!node) return;
      node.textContent = "";
      if (!items.length) {
        const li = document.createElement("li");
        li.className = "scorer-empty";
        li.textContent = "CHUA CO BAN THANG";
        node.appendChild(li);
        return;
      }
      items.forEach((name) => {
        const li = document.createElement("li");
        li.className = "scorer-item";
        li.textContent = name.toUpperCase();
        node.appendChild(li);
      });
    }

    function render(data) {
      const mode = normalizeInfoPanelMode(data.infoPanelMode);
      el.midbreakCard.classList.toggle("show", mode === "midbreak");

      const title = safeText(data.midbreakTitle, "NGHI GIUA HIEP");
      el.midbreakTitle.textContent = title.toUpperCase();

      el.teamA.textContent = safeText(data.teamA, "TEAM A").toUpperCase();
      el.teamB.textContent = safeText(data.teamB, "TEAM B").toUpperCase();
      el.scoreA.textContent = toNumber(data.scoreA, 0, 99);
      el.scoreB.textContent = toNumber(data.scoreB, 0, 99);

      renderScorerList(el.scorersA, parseScorers(data.scorersA));
      renderScorerList(el.scorersB, parseScorers(data.scorersB));
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        render(JSON.parse(raw));
      } catch {
        // Silent in overlay.
      }
    }

    async function loadFromServer() {
      try {
        const response = await fetch(API_PATH, { cache: "no-store" });
        if (!response.ok) throw new Error("GET failed");
        render(await response.json());
        return true;
      } catch {
        return false;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer !== null) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectStream();
      }, 1000);
    }

    function connectStream() {
      if (!CAN_USE_HTTP || typeof EventSource === "undefined") return;
      if (stream) stream.close();
      stream = new EventSource(STREAM_PATH);
      stream.onopen = () => {
        streamConnected = true;
      };
      stream.onmessage = (event) => {
        try {
          render(JSON.parse(event.data));
        } catch {
          // Ignore malformed event payload.
        }
      };
      stream.onerror = () => {
        streamConnected = false;
        if (stream) {
          stream.close();
          stream = null;
        }
        scheduleReconnect();
      };
    }

    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) loadFromStorage();
    });

    if (CAN_USE_HTTP) {
      connectStream();
      loadFromServer();
      setInterval(async () => {
        if (streamConnected) return;
        const ok = await loadFromServer();
        if (!ok) loadFromStorage();
      }, 1000);
    } else {
      loadFromStorage();
      setInterval(loadFromStorage, 250);
    }
  </script>
</body>
</html>
