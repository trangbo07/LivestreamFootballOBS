<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #5c0707;
      --bg-2: #2a0000;
      --gold: #f0c24d;
      --gold-soft: rgba(240, 194, 77, 0.35);
      --cream: #fff2d0;
      --ink: #ffffff;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: "Montserrat", "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .intro-board {
      width: min(1080px, 92vw);
      min-height: clamp(420px, 62vh, 560px);
      background:
        radial-gradient(1200px 600px at 10% -30%, rgba(255, 160, 120, 0.25) 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 120%, rgba(255, 120, 120, 0.2) 0%, transparent 60%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
      padding: 28px 30px 30px;
      position: relative;
      overflow: hidden;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .intro-board.is-hidden {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .intro-board::before {
      content: "";
      position: absolute;
      left: -10%;
      top: -30%;
      width: 120%;
      height: 140%;
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 2px, transparent 2px, transparent 10px);
      opacity: 0.35;
      pointer-events: none;
    }

    .intro-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--gold-soft);
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }

    .stage-block {
      text-align: right;
    }

    .stage-title {
      font-family: "Bebas Neue", "Montserrat", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.12em;
      color: var(--cream);
      text-transform: uppercase;
      margin: 0;
    }

    .stage-sub {
      margin: 2px 0 0;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
    }

    .mid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin: 22px 0 18px;
      position: relative;
      z-index: 2;
    }

    .team {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 16px;
      align-items: center;
    }

    .team.right {
      grid-template-columns: 1fr 84px;
      text-align: right;
    }

    .logo-ring {
      width: 84px;
      height: 84px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.4));
      border: 4px solid var(--gold);
      box-shadow: 0 10px 22px var(--shadow), inset 0 0 10px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .logo-ring img.show {
      display: block;
    }

    .logo-fallback {
      font-family: "Bebas Neue", "Montserrat", sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.12em;
      color: var(--cream);
      text-transform: uppercase;
    }

    .team-name {
      font-family: "Bebas Neue", "Montserrat", sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 8px 18px var(--shadow);
    }

    .vs-badge {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f7d56c 0%, #efb63d 100%);
      color: #4b1f00;
      font-family: "Bebas Neue", "Montserrat", sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.12em;
      border: 4px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 18px;
      position: relative;
      z-index: 2;
    }

    .meta .line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
    }

    .meta-center {
      display: grid;
      gap: 6px;
      text-align: center;
    }

    .meta-time {
      font-family: "Bebas Neue", "Montserrat", sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
    }

    .meta-venue {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
    }

    .tagline {
      margin-top: 14px;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 2;
    }

    .tagline.is-hidden {
      display: none;
    }

    @media (max-width: 840px) {
      .intro-board {
        padding: 22px 20px 24px;
      }

      .mid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .team,
      .team.right {
        grid-template-columns: 64px 1fr;
        text-align: left;
      }

      .team.right {
        grid-template-columns: 64px 1fr;
      }

      .vs-badge {
        width: 70px;
        height: 70px;
        font-size: 2rem;
        margin: 0 auto;
      }

      .meta {
        grid-template-columns: 1fr;
      }

      .meta .line {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="intro-board is-hidden" id="introBoard" role="img" aria-label="Giới thiệu trước trận">
      <div class="intro-top">
        <div class="badge">
          <span class="badge-dot"></span>
          <span>LIVE STREAMING</span>
        </div>
        <div class="stage-block">
          <h1 class="stage-title" id="introStage">CHUNG KET</h1>
          <p class="stage-sub" id="introTournament">GIAI BONG DA</p>
        </div>
      </div>

      <div class="mid">
        <div class="team left">
          <div class="logo-ring">
            <img id="logoImgA" alt="" />
            <span class="logo-fallback" id="logoFallbackA">A</span>
          </div>
          <h2 class="team-name" id="teamNameA">TEAM A</h2>
        </div>

        <div class="vs-badge">VS</div>

        <div class="team right">
          <h2 class="team-name" id="teamNameB">TEAM B</h2>
          <div class="logo-ring">
            <img id="logoImgB" alt="" />
            <span class="logo-fallback" id="logoFallbackB">B</span>
          </div>
        </div>
      </div>

      <div class="meta">
        <div class="line"></div>
        <div class="meta-center">
          <div class="meta-time" id="introDateTime">17/09/2024 • 17H00</div>
          <div class="meta-venue" id="introVenue">SAN JADE HILL</div>
        </div>
        <div class="line"></div>
      </div>

      <div class="tagline" id="introTagline">GIAI BONG DA MO RONG CUP JADE HILL & ALITA</div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "scoreData.v2";
    const API_PATH = "/api/score";
    const STREAM_PATH = "/api/score/stream";
    const CAN_USE_HTTP = location.protocol === "http:" || location.protocol === "https:";

    const el = {
      board: document.getElementById("introBoard"),
      stage: document.getElementById("introStage"),
      tournament: document.getElementById("introTournament"),
      dateTime: document.getElementById("introDateTime"),
      venue: document.getElementById("introVenue"),
      tagline: document.getElementById("introTagline"),
      teamA: document.getElementById("teamNameA"),
      teamB: document.getElementById("teamNameB"),
      logoImgA: document.getElementById("logoImgA"),
      logoImgB: document.getElementById("logoImgB"),
      logoFallbackA: document.getElementById("logoFallbackA"),
      logoFallbackB: document.getElementById("logoFallbackB")
    };

    let stream = null;
    let reconnectTimer = null;
    let streamConnected = false;

    function safeText(value, fallback) {
      const text = (value ?? "").toString().trim();
      return text || fallback;
    }

    function normalizeIntroShow(value) {
      const s = (value ?? "").toString().trim().toLowerCase();
      return s === "on" || s === "1" || s === "true" || s === "show" ? "on" : "off";
    }

    function setBoardVisible(show) {
      if (!el.board) return;
      if (show) {
        el.board.classList.remove("is-hidden");
      } else {
        el.board.classList.add("is-hidden");
      }
    }

    function getInitials(name) {
      const parts = (name || "").toUpperCase().split(/\s+/).filter(Boolean);
      if (!parts.length) return "";
      if (parts.length === 1) return parts[0].slice(0, 3);
      return (parts[0][0] + parts[1][0]).slice(0, 3);
    }

    function bindLogo(img, fallback, url, teamName) {
      const u = (url ?? "").toString().trim();
      const initials = getInitials(teamName) || "";
      if (!u) {
        if (img) {
          img.classList.remove("show");
          img.removeAttribute("src");
        }
        if (fallback) fallback.textContent = initials || "";
        return;
      }
      if (img) {
        img.alt = teamName || "Logo";
        img.onerror = () => {
          img.classList.remove("show");
          if (fallback) fallback.textContent = initials || "";
        };
        img.onload = () => {
          img.classList.add("show");
        };
        img.src = u;
      }
      if (fallback) fallback.textContent = initials || "";
    }

    function render(data) {
      const show = normalizeIntroShow(data.introShow) === "on";
      setBoardVisible(show);

      const stage = safeText(data.introStage, "CHUNG KET");
      const tournament = safeText(data.introTournament, "GIAI BONG DA");
      const dateText = safeText(data.introDate, "");
      const timeText = safeText(data.introTime, "");
      const venue = safeText(data.introVenue, "");
      const tagline = safeText(data.introTagline, "");

      el.stage.textContent = stage.toUpperCase();
      el.tournament.textContent = tournament.toUpperCase();

      const dateTime = [dateText, timeText].filter(Boolean).join(" • ");
      el.dateTime.textContent = dateTime || "";
      el.venue.textContent = venue.toUpperCase();

      const tag = tagline.toUpperCase();
      el.tagline.textContent = tag;
      el.tagline.classList.toggle("is-hidden", !tag);

      const teamA = safeText(data.teamA, "TEAM A");
      const teamB = safeText(data.teamB, "TEAM B");
      el.teamA.textContent = teamA.toUpperCase();
      el.teamB.textContent = teamB.toUpperCase();

      bindLogo(el.logoImgA, el.logoFallbackA, data.logoA, teamA);
      bindLogo(el.logoImgB, el.logoFallbackB, data.logoB, teamB);
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        render(JSON.parse(raw));
      } catch {
        // Silent in overlay.
      }
    }

    async function loadFromServer() {
      try {
        const response = await fetch(API_PATH, { cache: "no-store" });
        if (!response.ok) throw new Error("GET failed");
        render(await response.json());
        return true;
      } catch {
        return false;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer !== null) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectStream();
      }, 1000);
    }

    function connectStream() {
      if (!CAN_USE_HTTP || typeof EventSource === "undefined") return;
      if (stream) stream.close();
      stream = new EventSource(STREAM_PATH);
      stream.onopen = () => {
        streamConnected = true;
      };
      stream.onmessage = (event) => {
        try {
          render(JSON.parse(event.data));
        } catch {
          // Ignore malformed payload.
        }
      };
      stream.onerror = () => {
        streamConnected = false;
        if (stream) {
          stream.close();
          stream = null;
        }
        scheduleReconnect();
      };
    }

    if (CAN_USE_HTTP) {
      connectStream();
      loadFromServer();
      setInterval(async () => {
        if (streamConnected) return;
        const ok = await loadFromServer();
        if (!ok) loadFromStorage();
      }, 1000);
    } else {
      loadFromStorage();
      setInterval(loadFromStorage, 300);
    }
  </script>
</body>
</html>
