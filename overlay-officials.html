<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Officials</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 110px 40px 40px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .officials-card {
      width: min(640px, 92vw);
      display: grid;
      grid-template-columns: 86px 1fr;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
    }

    .officials-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .officials-icon {
      display: grid;
      place-items: center;
      font-size: 2.6rem;
      background: rgba(255, 255, 255, 0.98);
      color: #d52b2b;
      border-right: 2px solid rgba(12, 31, 61, 0.22);
    }

    .officials-body {
      display: grid;
      grid-template-rows: auto auto auto;
    }

    .officials-title {
      background: #0a4678;
      color: #fdf06c;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 700;
      text-align: center;
      padding: 8px 12px;
    }

    .officials-name {
      color: #101010;
      background: rgba(255, 255, 255, 0.96);
      font-size: clamp(1.25rem, 3vw, 2.05rem);
      font-weight: 800;
      text-align: center;
      padding: 10px 12px 8px;
      line-height: 1.1;
    }

    .officials-commentary {
      background: rgba(235, 242, 249, 0.97);
      color: #10263f;
      font-size: clamp(0.92rem, 1.8vw, 1.2rem);
      font-weight: 700;
      text-align: center;
      padding: 8px 12px 10px;
    }

    @media (max-width: 640px) {
      .wrap { padding: 96px 10px 10px; }
      .officials-card { grid-template-columns: 66px 1fr; width: calc(100% - 4px); }
      .officials-icon { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="officials-card" id="officialsCard">
      <div class="officials-icon">🚩</div>
      <div class="officials-body">
        <div class="officials-title">Trọng tài</div>
        <div class="officials-name" id="refereeName">---</div>
        <div class="officials-commentary" id="commentaryNames">BLV: ---</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "scoreData.v2";
    const API_PATH = "/api/score";
    const STREAM_PATH = "/api/score/stream";
    const CAN_USE_HTTP = location.protocol === "http:" || location.protocol === "https:";

    const el = {
      officialsCard: document.getElementById("officialsCard"),
      refereeName: document.getElementById("refereeName"),
      commentaryNames: document.getElementById("commentaryNames")
    };

    let streamConnected = false;
    let stream = null;
    let reconnectTimer = null;

    function normalizeInfoPanelMode(value) {
      const s = (value ?? "").toString().trim().toLowerCase();
      if (s === "officials" || s === "ref" || s === "blv") return "officials";
      return "off";
    }

    function safeText(value, fallback) {
      const text = (value ?? "").toString().trim();
      return text || fallback;
    }

    function render(data) {
      const mode = normalizeInfoPanelMode(data.infoPanelMode);
      el.officialsCard.classList.toggle("show", mode === "officials");

      const ref = safeText(data.refereeName, "---");
      const blvMain = safeText(data.commentatorMain, "---");
      const blvGuest = safeText(data.commentatorGuest, "");
      const cmt = blvGuest ? `BLV: ${blvMain} | ${blvGuest}` : `BLV: ${blvMain}`;

      el.refereeName.textContent = ref.toUpperCase();
      el.commentaryNames.textContent = cmt.toUpperCase();
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        render(JSON.parse(raw));
      } catch {
        // Silent in overlay.
      }
    }

    async function loadFromServer() {
      try {
        const response = await fetch(API_PATH, { cache: "no-store" });
        if (!response.ok) throw new Error("GET failed");
        render(await response.json());
        return true;
      } catch {
        return false;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer !== null) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectStream();
      }, 1000);
    }

    function connectStream() {
      if (!CAN_USE_HTTP || typeof EventSource === "undefined") return;
      if (stream) stream.close();
      stream = new EventSource(STREAM_PATH);
      stream.onopen = () => {
        streamConnected = true;
      };
      stream.onmessage = (event) => {
        try {
          render(JSON.parse(event.data));
        } catch {
          // Ignore malformed event payload.
        }
      };
      stream.onerror = () => {
        streamConnected = false;
        if (stream) {
          stream.close();
          stream = null;
        }
        scheduleReconnect();
      };
    }

    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) loadFromStorage();
    });

    if (CAN_USE_HTTP) {
      connectStream();
      loadFromServer();
      setInterval(async () => {
        if (streamConnected) return;
        const ok = await loadFromServer();
        if (!ok) loadFromStorage();
      }, 1000);
    } else {
      loadFromStorage();
      setInterval(loadFromStorage, 250);
    }
  </script>
</body>
</html>
