<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay đội hình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel-bg: #0a1628;
      --panel-bg2: #0d1f35;
      --text: #f4f7fb;
      --muted: rgba(255, 255, 255, 0.55);
      --line: rgba(255, 255, 255, 0.07);
      --team-a: #00c6a8;
      --team-a-dim: rgba(0, 198, 168, 0.22);
      --team-b: #ff4d6d;
      --team-b-dim: rgba(255, 77, 109, 0.22);
      --hlv: #ffd54f;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      max-width: 100%;
      background: transparent;
      color: var(--text);
      font-family: "Barlow Semi Condensed", "Rajdhani", "Segoe UI", Tahoma, sans-serif;
    }

    .stage {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
      pointer-events: none;
      overflow: hidden;
      box-sizing: border-box;
    }

    .board {
      width: min(1280px, 100%);
      max-width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .board.lineup-mode-off {
      display: none;
    }

    .board.lineup-mode-a {
      grid-template-columns: 1fr;
      width: 100%;
      max-width: min(640px, 100%);
      margin: 0 auto;
    }

    .board.lineup-mode-a .lineup-card-b {
      display: none;
    }

    .board.lineup-mode-b {
      grid-template-columns: 1fr;
      width: 100%;
      max-width: min(640px, 100%);
      margin: 0 auto;
    }

    .board.lineup-mode-b .lineup-card-a {
      display: none;
    }

    .lineup-off-hint {
      display: none;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      padding: 28px 20px;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 600;
      line-height: 1.45;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
      max-width: 520px;
      margin: 0 auto;
      letter-spacing: 0.02em;
    }

    .lineup-off-hint.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .board.lineup-mode-both {
        grid-template-columns: 1fr;
      }
    }

    .lineup-card {
      --accent: var(--team-a);
      --accent-dim: var(--team-a-dim);
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 100%;
      border-radius: 4px;
      overflow: hidden;
      min-height: 300px;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.04) 0%, transparent 42%),
        linear-gradient(180deg, var(--panel-bg) 0%, #060d18 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 24px 48px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(0, 0, 0, 0.25);
      animation: card-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .lineup-card-b {
      --accent: var(--team-b);
      --accent-dim: var(--team-b-dim);
    }

    .lineup-card-b .lineup-head {
      background: linear-gradient(270deg, var(--accent-dim) 0%, rgba(0, 0, 0, 0.15) 55%);
    }

    .lineup-card-b .lineup-head::before {
      left: auto;
      right: 0;
    }

    .lineup-card-b .lineup-head-inner {
      text-align: right;
      padding: 11px 22px 12px 16px;
    }

    .lineup-card-b .lineup-coach {
      justify-content: flex-start;
      flex-direction: row-reverse;
      text-align: left;
    }

    .lineup-card-b .lineup-mainrow {
      flex-direction: row-reverse;
    }

    .lineup-card-b .lineup-logo-col {
      border-left: none;
      border-right: 1px solid var(--line);
      padding: 8px 14px 8px 8px;
    }

    .lineup-card:nth-child(2) {
      animation-delay: 0.07s;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lineup-head {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(90deg, var(--accent-dim) 0%, rgba(0, 0, 0, 0.15) 55%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lineup-head::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(180deg, var(--accent) 0%, #1a1a1a 100%);
    }

    .lineup-card-a .lineup-head::before {
      box-shadow: 0 0 20px rgba(0, 198, 168, 0.45);
    }

    .lineup-card-b .lineup-head::before {
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.45);
    }

    .lineup-head-inner {
      padding: 11px 16px 12px 22px;
      text-align: left;
    }

    .lineup-eyebrow {
      display: block;
      font-family: "Rajdhani", sans-serif;
      font-size: clamp(0.62rem, 1.1vw, 0.72rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 2px;
      opacity: 0.95;
    }

    .lineup-title {
      margin: 0;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.05;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      color: #fff;
    }

    .lineup-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 28%),
        linear-gradient(135deg, var(--panel-bg2) 0%, #070f1a 100%);
    }

    .lineup-mainrow {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      padding: 12px 12px 10px 14px;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .lineup-list-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .lineup-list-header {
      display: grid;
      grid-template-columns: 2.35rem minmax(0, 1fr);
      align-items: baseline;
      gap: 10px;
      padding: 4px 8px 8px 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .lineup-list-header span {
      font-size: clamp(0.65rem, 1vw, 0.72rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lineup-list-header span:last-child {
      text-align: left;
    }

    .lineup-list-wrap.is-empty .lineup-list-header {
      display: none;
    }

    .lineup-list {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      border-radius: 2px;
    }

    .lineup-li {
      display: grid;
      grid-template-columns: 2.35rem minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      margin: 0;
      font-size: clamp(0.84rem, 1.25vw, 0.98rem);
      font-weight: 600;
      line-height: 1.25;
      border-bottom: 1px solid var(--line);
      animation: row-in 0.38s ease both;
    }

    .lineup-li:nth-child(even) {
      background: rgba(255, 255, 255, 0.025);
    }

    .lineup-li:nth-child(1) { animation-delay: 0.03s; }
    .lineup-li:nth-child(2) { animation-delay: 0.06s; }
    .lineup-li:nth-child(3) { animation-delay: 0.09s; }
    .lineup-li:nth-child(4) { animation-delay: 0.12s; }
    .lineup-li:nth-child(5) { animation-delay: 0.15s; }
    .lineup-li:nth-child(6) { animation-delay: 0.18s; }
    .lineup-li:nth-child(7) { animation-delay: 0.21s; }
    .lineup-li:nth-child(8) { animation-delay: 0.24s; }
    .lineup-li:nth-child(9) { animation-delay: 0.27s; }
    .lineup-li:nth-child(10) { animation-delay: 0.3s; }
    .lineup-li:nth-child(11) { animation-delay: 0.33s; }

    @keyframes row-in {
      from {
        opacity: 0;
        transform: translateX(-5px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .lineup-card:nth-child(2) .lineup-li {
      animation-name: row-in-b;
    }

    @keyframes row-in-b {
      from {
        opacity: 0;
        transform: translateX(5px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .jersey {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.1rem;
      height: 1.75rem;
      padding: 0 4px;
      border-radius: 3px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: clamp(0.78rem, 1.15vw, 0.92rem);
      color: #fff;
      background: linear-gradient(145deg, var(--accent-dim) 0%, #0c121c 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 0 0 1px var(--accent-dim) inset,
        0 1px 0 rgba(255, 255, 255, 0.12) inset,
        0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .p-name {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
      letter-spacing: 0.02em;
    }

    .lineup-logo-col {
      flex: 0 0 auto;
      width: min(34%, 148px);
      max-width: 40%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      padding: 8px 8px 8px 14px;
      border-left: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, transparent 55%);
    }

    .lineup-logo-col img {
      max-width: 100%;
      max-height: min(200px, 40vh);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
    }

    .lineup-logo-col img.hidden {
      display: none;
    }

    .lineup-logo-placeholder {
      width: 100%;
      aspect-ratio: 1;
      max-height: 120px;
      border-radius: 4px;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.2);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lineup-logo-col.is-empty .lineup-logo-placeholder {
      display: flex;
    }

    .lineup-coach {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 14px 12px;
      margin-top: auto;
      text-align: right;
      font-size: clamp(0.78rem, 1.15vw, 0.92rem);
      font-weight: 600;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.35) 0%, transparent 100%);
      border-top: 1px solid var(--line);
    }

    .lineup-coach .hlv {
      flex: 0 0 auto;
      font-family: "Rajdhani", sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--hlv);
    }

    .lineup-coach .coach-name {
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .lineup-coach.is-empty .coach-name {
      opacity: 0.5;
      font-style: italic;
      font-weight: 500;
    }

    .lineup-list > li.lineup-empty {
      display: block;
      padding: 22px 12px;
      text-align: center;
      font-style: italic;
      opacity: 0.72;
      font-size: 0.92rem;
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p id="lineupOffHint" class="lineup-off-hint is-visible" role="status">
    
    </p>
    <div class="board lineup-mode-off" id="board">
      <section class="lineup-card lineup-card-a" id="cardA" aria-label="Đội A">
        <header class="lineup-head">
          <div class="lineup-head-inner">
            <span class="lineup-eyebrow">Đội hình xuất phát</span>
            <h2 class="lineup-title" id="titleA">ĐỘI A</h2>
          </div>
        </header>
        <div class="lineup-body">
          <div class="lineup-mainrow">
            <div class="lineup-list-wrap">
              <div class="lineup-list-header">
                <span>#</span>
                <span>Cầu thủ</span>
              </div>
              <ul class="lineup-list" id="listA"></ul>
            </div>
            <div class="lineup-logo-col is-empty" id="logoColA">
              <span class="lineup-logo-placeholder" aria-hidden="true">Logo</span>
              <img id="logoImgA" alt="" class="hidden" />
            </div>
          </div>
          <div class="lineup-coach is-empty" id="coachWrapA">
            <span class="hlv">HLV</span><span class="coach-name" id="coachA">—</span>
          </div>
        </div>
      </section>
      <section class="lineup-card lineup-card-b" id="cardB" aria-label="Đội B">
        <header class="lineup-head">
          <div class="lineup-head-inner">
            <span class="lineup-eyebrow">Đội hình xuất phát</span>
            <h2 class="lineup-title" id="titleB">ĐỘI B</h2>
          </div>
        </header>
        <div class="lineup-body">
          <div class="lineup-mainrow">
            <div class="lineup-list-wrap">
              <div class="lineup-list-header">
                <span>#</span>
                <span>Cầu thủ</span>
              </div>
              <ul class="lineup-list" id="listB"></ul>
            </div>
            <div class="lineup-logo-col is-empty" id="logoColB">
              <span class="lineup-logo-placeholder" aria-hidden="true">Logo</span>
              <img id="logoImgB" alt="" class="hidden" />
            </div>
          </div>
          <div class="lineup-coach is-empty" id="coachWrapB">
            <span class="hlv">HLV</span><span class="coach-name" id="coachB">—</span>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "scoreData.v2";
    const API_PATH = "/api/score";
    const STREAM_PATH = "/api/score/stream";
    const CAN_USE_HTTP = location.protocol === "http:" || location.protocol === "https:";

    const el = {
      board: document.getElementById("board"),
      offHint: document.getElementById("lineupOffHint"),
      titleA: document.getElementById("titleA"),
      titleB: document.getElementById("titleB"),
      listA: document.getElementById("listA"),
      listB: document.getElementById("listB"),
      logoImgA: document.getElementById("logoImgA"),
      logoImgB: document.getElementById("logoImgB"),
      coachA: document.getElementById("coachA"),
      coachB: document.getElementById("coachB"),
      coachWrapA: document.getElementById("coachWrapA"),
      coachWrapB: document.getElementById("coachWrapB")
    };

    let lastPayloadKey = "";

    let stream = null;
    let reconnectTimer = null;
    let streamConnected = false;

    function safeText(value, fallback) {
      const text = (value ?? "").toString().trim();
      return text || fallback;
    }

    function normalizeLineupShow(value) {
      const s = (value ?? "").toString().trim().toLowerCase();
      if (s === "a") return "A";
      if (s === "b") return "B";
      if (s === "both" || s === "ab" || s === "all") return "both";
      return "off";
    }

    function applyLineupVisibility(mode) {
      const m = normalizeLineupShow(mode);
      if (!el.board || !el.offHint) return;
      el.board.classList.remove("lineup-mode-off", "lineup-mode-a", "lineup-mode-b", "lineup-mode-both");
      if (m === "off") {
        el.board.classList.add("lineup-mode-off");
        el.offHint.classList.add("is-visible");
      } else {
        el.offHint.classList.remove("is-visible");
        if (m === "A") el.board.classList.add("lineup-mode-a");
        else if (m === "B") el.board.classList.add("lineup-mode-b");
        else el.board.classList.add("lineup-mode-both");
      }
    }

    function parseLineup(raw) {
      return (raw ?? "")
        .toString()
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean)
        .slice(0, 11);
    }

    /** Tách số áo + tên kiểu "10 Nguyễn A" hoặc "10 - Tên". */
    function splitPlayerLine(line, index) {
      const t = line.trim();
      const m = t.match(/^(\d{1,2})\s*[-–.:]\s*(.+)$/);
      if (m && m[2]) return { num: m[1], name: m[2].trim() };
      const m2 = t.match(/^(\d{1,2})\s+(.+)$/);
      if (m2) return { num: m2[1], name: m2[2].trim() };
      if (/^\d{1,2}$/.test(t)) return { num: t, name: "" };
      return { num: String(index + 1).padStart(2, "0"), name: t };
    }

    function bindLogo(img, url) {
      const col = img.closest(".lineup-logo-col");
      const u = (url ?? "").toString().trim();
      if (!u) {
        img.classList.add("hidden");
        img.removeAttribute("src");
        if (col) col.classList.add("is-empty");
        return;
      }
      if (col) col.classList.remove("is-empty");
      img.classList.remove("hidden");
      img.alt = "Logo";
      img.onerror = () => {
        img.classList.add("hidden");
        if (col) col.classList.add("is-empty");
      };
      img.onload = () => {
        img.classList.remove("hidden");
        if (col) col.classList.remove("is-empty");
      };
      img.src = u;
    }

    function setCoach(wrap, span, text) {
      const t = (text ?? "").toString().trim();
      span.textContent = t || "—";
      if (t) {
        wrap.classList.remove("is-empty");
      } else {
        wrap.classList.add("is-empty");
      }
    }

    function renderPlayers(ul, lines) {
      const wrap = ul.closest(".lineup-list-wrap");
      ul.textContent = "";
      if (!lines.length) {
        if (wrap) wrap.classList.add("is-empty");
        const li = document.createElement("li");
        li.className = "lineup-empty";
        li.textContent = "— Chưa công bố đội hình —";
        ul.appendChild(li);
        return;
      }
      if (wrap) wrap.classList.remove("is-empty");
      lines.forEach((line, i) => {
        const { num, name } = splitPlayerLine(line, i);
        const li = document.createElement("li");
        li.className = "lineup-li";
        const n = document.createElement("span");
        n.className = "jersey";
        n.textContent = num;
        const nm = document.createElement("span");
        nm.className = "p-name";
        nm.textContent = name || line.trim();
        li.appendChild(n);
        li.appendChild(nm);
        ul.appendChild(li);
      });
    }

    function render(data) {
      const showMode = normalizeLineupShow(data.lineupShow);
      applyLineupVisibility(showMode);

      const key = JSON.stringify({
        teamA: data.teamA,
        teamB: data.teamB,
        coachA: data.coachA,
        coachB: data.coachB,
        logoA: data.logoA,
        logoB: data.logoB,
        lineupA: data.lineupA,
        lineupB: data.lineupB,
        lineupShow: showMode
      });
      if (key === lastPayloadKey) return;
      lastPayloadKey = key;

      el.titleA.textContent = safeText(data.teamA, "ĐỘI A").toUpperCase();
      el.titleB.textContent = safeText(data.teamB, "ĐỘI B").toUpperCase();
      renderPlayers(el.listA, parseLineup(data.lineupA));
      renderPlayers(el.listB, parseLineup(data.lineupB));
      bindLogo(el.logoImgA, data.logoA);
      bindLogo(el.logoImgB, data.logoB);
      setCoach(el.coachWrapA, el.coachA, data.coachA);
      setCoach(el.coachWrapB, el.coachB, data.coachB);
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        render(JSON.parse(raw));
      } catch {
        // Silent in overlay.
      }
    }

    async function loadFromServer() {
      try {
        const response = await fetch(API_PATH, { cache: "no-store" });
        if (!response.ok) throw new Error("GET failed");
        render(await response.json());
        return true;
      } catch {
        return false;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer !== null) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectStream();
      }, 1000);
    }

    function connectStream() {
      if (!CAN_USE_HTTP || typeof EventSource === "undefined") return;
      if (stream) stream.close();
      stream = new EventSource(STREAM_PATH);
      stream.onopen = () => {
        streamConnected = true;
      };
      stream.onmessage = (event) => {
        try {
          render(JSON.parse(event.data));
        } catch {
          // Ignore malformed payload.
        }
      };
      stream.onerror = () => {
        streamConnected = false;
        if (stream) {
          stream.close();
          stream = null;
        }
        scheduleReconnect();
      };
    }

    if (CAN_USE_HTTP) {
      connectStream();
      loadFromServer();
      setInterval(async () => {
        if (streamConnected) return;
        const ok = await loadFromServer();
        if (!ok) loadFromStorage();
      }, 1000);
    } else {
      loadFromStorage();
      setInterval(loadFromStorage, 300);
    }
  </script>
